name: Render premium video

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to render
        required: false
        default: ''
  push:
    branches:
      - claude/powerpoint-to-video-cloud-3oujl
    paths:
      - 'input/**'
      - 'public/audio/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'remotion.config.ts'
      - '.github/workflows/render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies for Chromium + ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            fonts-inter fonts-jetbrains-mono fonts-noto-color-emoji || \
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2 \
            fonts-noto-color-emoji

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Verify inputs
        run: |
          test -f input/deck.pptx || { echo "::error::input/deck.pptx is missing"; exit 1; }
          test -f public/audio/master-voiceover.mp3 || { echo "::error::public/audio/master-voiceover.mp3 is missing"; exit 1; }

      - name: Extract PowerPoint
        run: npm run extract

      - name: Plan motion
        run: npm run plan

      - name: Forced alignment
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: npm run align

      - name: Build scene timeline
        run: npm run build:data

      - name: Render video
        # @remotion/renderer downloads its Chromium binary on first invocation.
        run: npm run render

      - name: Upload final.mp4
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/final.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated scene data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-debug
          path: |
            public/extracted/slides.json
            public/extracted/plan.json
            public/extracted/alignment.json
            src/data/scenes.json
          if-no-files-found: ignore
          retention-days: 7
