name: Render premium video

# Runs Stage 1 (prepare audio, extract, transcribe) then renders the
# Remotion composition. Assumes the Stage 2 design files have been
# committed (presentation.json, motion-plan.json, scene-timings.json).
# Uploads out/final.mp4 as the downloadable artifact.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to render
        required: false
        default: ''
  push:
    branches:
      - claude/powerpoint-to-video-cloud-3oujl
    paths:
      - 'src/**'
      - 'remotion.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies for Chromium + ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            fonts-noto-color-emoji || \
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2 \
            fonts-noto-color-emoji

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Verify inputs
        run: |
          test -f input/deck.pptx || { echo "::error::input/deck.pptx is missing"; exit 1; }
          test -f input/master-voiceover.mp3 || { echo "::error::input/master-voiceover.mp3 is missing"; exit 1; }

      - name: Stage 1 (prepare audio + extract + transcribe)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: npm run stage1

      - name: Render video
        run: npm run render

      - name: Upload final.mp4
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/final.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Upload pipeline data for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-debug
          path: |
            src/data/pptx-extracted.json
            src/data/master-transcript.json
            src/data/master-transcript.txt
            src/data/presentation.json
            src/data/motion-plan.json
            src/data/scene-timings.json
            src/data/scenes.json
          if-no-files-found: ignore
          retention-days: 14
